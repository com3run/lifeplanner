#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M -XX:+UseG1GC -XX:+UseCodeCacheFlushing -XX:ReservedCodeCacheSize=512m

#Gradle
org.gradle.jvmargs=-Xmx8192M -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=8

#Kotlin Native
kotlin.native.jvmArgs=-Xmx6144M -XX:+UseG1GC

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.compiler.expectActualClasses=true

# Native compiler cache is enabled (static) by default — the kotlin.native.cacheKind
# property was removed in Kotlin 2.3.20. To disable, use disableNativeCache in binaries {}.
kotlin.native.ignoreDisabledTargets=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

#Incremental compilation — explicit opt-in for KMP
kotlin.incremental=true
kotlin.incremental.multiplatform=true

# Silence the AGP+KMP deprecation banner — already known, tracked on the upgrade-to-AGP-9 branch.
kotlin.suppressGradlePluginWarnings=NonKmpAgpIsDeprecated

# Config cache off — invalidates on file moves and the two local.properties reads
# in composeApp/build.gradle.kts. Worth re-enabling if you stop touching those.
org.gradle.configuration-cache=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
