#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M -XX:+UseG1GC -XX:+UseCodeCacheFlushing -XX:ReservedCodeCacheSize=320m

#Gradle
org.gradle.jvmargs=-Xmx4096M -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

#Kotlin Native
kotlin.native.jvmArgs=-Xmx4096M -XX:+UseG1GC

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.compiler.expectActualClasses=true

#Kotlin Native cache — KEEP ENABLED for fast incremental native builds
kotlin.native.cacheKind=static
kotlin.native.ignoreDisabledTargets=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true

#Incremental compilation — explicit opt-in for KMP
kotlin.incremental=true
kotlin.incremental.multiplatform=true

org.gradle.configuration-cache=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Required bypass for KMP + com.android.application on AGP 9.x until the project
# migrates to com.android.kotlin.multiplatform.library. Removing these breaks the build.
# https://developer.android.com/kotlin/multiplatform/plugin
android.builtInKotlin=false
android.newDsl=false
