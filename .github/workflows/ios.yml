name: iOS CI/CD

on:
  # Manual only: builds ship to TestFlight when you explicitly run this workflow.
  # (The previous `push: branches: [develop]` trigger was dead -- no such branch.)
  # To re-enable automatic builds later, uncomment:
  #   push:
  #     branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Was pinned to /Applications/Xcode_15.0.app, which no longer exists on the runner
      # image and failed the job before it built anything. The project is developed on
      # Xcode 26, so track the newest stable the image ships.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The Xcode build shells out to Gradle (embedAndSignAppleFrameworkForXcode), so the
      # JDK has to be here and match what the project builds with locally.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      # Same gitignored-secrets problem as the Android workflow: the Xcode build runs the
      # Gradle embedAndSignAppleFrameworkForXcode script, so BuildKonfig needs
      # local.properties, and the Firebase plist is required for the app to start.
      - name: Restore build secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          PERSONA_API_SECRET: ${{ secrets.PERSONA_API_SECRET }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          set -euo pipefail
          missing=""
          for v in SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_SERVICE_INFO_PLIST; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

          printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > app/iosApp/iosApp/GoogleService-Info.plist
          plutil -lint app/iosApp/iosApp/GoogleService-Info.plist

          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'POSTHOG_API_KEY=%s\n' "$POSTHOG_API_KEY"
            printf 'POSTHOG_HOST=%s\n' "${POSTHOG_HOST:-https://us.i.posthog.com}"
            printf 'PERSONA_API_SECRET=%s\n' "$PERSONA_API_SECRET"
          } > local.properties

      - name: Create Export Options Plist
        run: |
          echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><plist version=\"1.0\"><dict><key>method</key><string>${{ secrets.EXPORT_METHOD }}</string></dict></plist>" > exportOptions.plist

      - name: Build and export IPA
        run: |
          xcodebuild -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            -allowProvisioningUpdates archive

          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $PWD/build

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          app-path: build/iosApp.ipa

      - name: Clean up secrets
        if: always()
        run: rm -f local.properties app/iosApp/iosApp/GoogleService-Info.plist

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WF: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."; exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="🚨"; fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          TEXT=$(printf '%s LifePlanner CI: %s\nstatus: %s\nbranch: %s\ncommit: %s\n%s' \
            "$EMOJI" "$WF" "$JOB_STATUS" "$REF" "${GITHUB_SHA:0:7}" "$COMMIT_MSG")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="$TEXT" >/dev/null
          echo "Telegram notification sent ($JOB_STATUS)."