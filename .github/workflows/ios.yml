name: iOS CI/CD

on:
  # Manual only: builds ship to TestFlight when you explicitly run this workflow.
  # (The previous `push: branches: [develop]` trigger was dead -- no such branch.)
  # To re-enable automatic builds later, uncomment:
  #   push:
  #     branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Create Export Options Plist
        run: |
          echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><plist version=\"1.0\"><dict><key>method</key><string>${{ secrets.EXPORT_METHOD }}</string></dict></plist>" > exportOptions.plist

      - name: Build and export IPA
        run: |
          xcodebuild -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            -allowProvisioningUpdates archive

          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath $PWD/build

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          app-path: build/iosApp.ipa

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WF: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."; exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="🚨"; fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          TEXT=$(printf '%s LifePlanner CI: %s\nstatus: %s\nbranch: %s\ncommit: %s\n%s' \
            "$EMOJI" "$WF" "$JOB_STATUS" "$REF" "${GITHUB_SHA:0:7}" "$COMMIT_MSG")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="$TEXT" >/dev/null
          echo "Telegram notification sent ($JOB_STATUS)."