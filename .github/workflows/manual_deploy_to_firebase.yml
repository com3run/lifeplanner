name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      release_notes:
        type: string
        required: true
        default: 'Manual Debug Build'
        description: 'Release Notes'

jobs:
  build:
    name: Building and distributing app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore build secrets
        uses: ./.github/actions/restore-android-secrets
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
          persona-api-secret: ${{ secrets.PERSONA_API_SECRET }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build Release AAB
        run: ./gradlew :app:androidApp:bundleRelease

      - name: Clean up secrets
        if: always()
        run: rm -f lifeplanner.jks local.properties app/androidApp/google-services.json

      - name: Upload Artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          releaseNotes: ${{ inputs.release_notes }}

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WF: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."; exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="🚨"; fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          TEXT=$(printf '%s LifePlanner CI: %s\nstatus: %s\nbranch: %s\ncommit: %s\n%s' \
            "$EMOJI" "$WF" "$JOB_STATUS" "$REF" "${GITHUB_SHA:0:7}" "$COMMIT_MSG")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="$TEXT" >/dev/null
          echo "Telegram notification sent ($JOB_STATUS)."