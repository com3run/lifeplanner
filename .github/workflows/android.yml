name: Android CI

on:
  # Manual only: builds ship to testers when you explicitly run this workflow.
  # (The previous `push: branches: [develop]` trigger was dead -- no such branch.)
  # Pull requests are checked by android-pr.yml, which runs the unit tests and a debug build
  # without signing or distributing anything. Adding a `pull_request` trigger here instead
  # would send every pushed commit to the internal testers.
  workflow_dispatch:


jobs:
  build:
    name: Building and distributing app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # local.properties, google-services.json and the keystore are all gitignored, so a
      # checkout alone cannot build a shippable app: BuildKonfig would bake in an empty
      # SUPABASE_URL and the AAB would come out unsigned.
      - name: Restore build secrets
        uses: ./.github/actions/restore-android-secrets
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-anon-key: ${{ secrets.SUPABASE_ANON_KEY }}
          posthog-api-key: ${{ secrets.POSTHOG_API_KEY }}
          persona-api-secret: ${{ secrets.PERSONA_API_SECRET }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build Release AAB
        run: ./gradlew :app:androidApp:bundleRelease

      # The keystore block in androidApp/build.gradle.kts is conditional, so a bad keystore
      # path yields an unsigned AAB and a green build. Play rejects that upload; catch it here.
      - name: Verify the AAB is signed
        run: |
          set -euo pipefail
          AAB=app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          if ! unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::$AAB is UNSIGNED - check the RELEASE_* secrets."
            exit 1
          fi
          echo "AAB is signed."

      - name: Clean up secrets
        if: always()
        run: rm -f lifeplanner.jks local.properties app/androidApp/google-services.json

      - name: Upload Artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: internal
          file: app/androidApp/build/outputs/bundle/release/androidApp-release.aab
          releaseNotes: "GitHub Action Build: $(git log -1 --pretty=%B)"

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          WF: ${{ github.workflow }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets not set; skipping notification."; exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="🚨"; fi
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "")
          TEXT=$(printf '%s LifePlanner CI: %s\nstatus: %s\nbranch: %s\ncommit: %s\n%s' \
            "$EMOJI" "$WF" "$JOB_STATUS" "$REF" "${GITHUB_SHA:0:7}" "$COMMIT_MSG")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="$TEXT" >/dev/null
          echo "Telegram notification sent ($JOB_STATUS)."