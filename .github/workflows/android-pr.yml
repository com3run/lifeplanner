name: Android PR checks

# android.yml stays manual on purpose: running it builds a signed AAB and ships it to the
# internal testers, which is not what opening a pull request should do. This is the gate for
# pull requests instead. It runs what actually catches a broken change (the host unit tests
# and a debug build) on Ubuntu, with no keystore and nothing to distribute.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A second push to the same pull request makes the first run irrelevant.
concurrency:
  group: android-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # local.properties is optional in both build scripts: BuildKonfig falls back to empty
      # strings and the signing block is skipped when no keystore is there, so tests and a
      # debug build need none of the release secrets. google-services.json is the exception,
      # because the Firebase Gradle plugin in :app:androidApp refuses to configure without it.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/androidApp/google-services.json

      - name: Unit tests
        run: ./gradlew :app:shared:testAndroidHostTest

      - name: Debug build
        run: ./gradlew :app:androidApp:assembleDebug

      # A red X with no detail sends you to reproduce the whole suite locally.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/shared/build/reports/tests/testAndroidHostTest
          retention-days: 7

      - name: Clean up secrets
        if: always()
        run: rm -f app/androidApp/google-services.json
