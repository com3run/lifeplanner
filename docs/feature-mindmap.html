#hud-top {

  pointer-events: none;
  display: flex; align-items: center; gap: 16px;
}
#hud-top h1 {

}

}
#hud-top .badge {

  color: #818cf8; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.5px;
  pointer-events: auto;
}

#controls {
  position: fixed; bottom: 24px; right: 24px;
  display: flex; flex-direction: column; gap: 6px;
}
.ctrl-btn {
  width: 38px; height: 38px;
  background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; color: #94a3b8;

}
.ctrl-btn:hover { background: rgba(99,102,241,0.25); color: #c7d2fe; border-color: rgba(99,102,241,0.4); }

#legend {
  position: fixed; bottom: 24px; left: 24px;
  background: rgba(10,16,32,0.92); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px; padding: 14px 16px;
  max-width: 220px;
}
#legend h4 { font-size: 9px; color: #475569; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
.leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.leg-label { font-size: 11px; color: #94a3b8; }
.leg-new { font-size: 9px; background: rgba(239,68,68,0.15); color: #f87171;
  border: 1px solid rgba(239,68,68,0.3); padding: 1px 5px; border-radius: 6px; margin-left: 2px; }

#hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: #334155; letter-spacing: 0.5px;
  pointer-events: none;
}

.tooltip {
  position: fixed; pointer-events: none;
  background: rgba(10,16,32,0.97); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 10px 14px;
  color: #e2e8f0; font-size: 12px;
  opacity: 0; transition: opacity 0.15s;
  z-index: 100; max-width: 220px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.tooltip.show { opacity: 1; }
.tooltip strong { display: block; margin-bottom: 4px; font-size: 13px; color: #f1f5f9; }
.tooltip ul { padding-left: 14px; }
.tooltip li { margin-bottom: 2px; color: #94a3b8; line-height: 1.5; }
</style>

// ─────────────────────────────────────────────
// SVG HELPERS
// ─────────────────────────────────────────────
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function text(str, attrs, parent) {
  const t = el("text", attrs, parent);
  t.textContent = str;
  return t;
}
function bezier(x1,y1,x2,y2) {
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1;
  const cx1 = x1 + dx*0.5, cy1 = y1 + dy*0.1;
  const cx2 = x2 - dx*0.5, cy2 = y2 - dy*0.1;
  return `M${x1},${y1} C${cx1},${cy1} ${cx2},${cy2} ${x2},${y2}`;
}
function hex2rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─────────────────────────────────────────────
// LAYOUT CONSTANTS
// ─────────────────────────────────────────────
const W = 4000, H = 4000;   // virtual canvas
const CX = W/2, CY = H/2;  // center
const R1 = 340;             // center → branch
const R2 = 680;             // center → leaf cluster origin
const LEAF_SPREAD = 140;    // half-height of leaf column per branch

// ─────────────────────────────────────────────
// BUILD SVG
// ─────────────────────────────────────────────
const svg = document.getElementById("svg");
const defs = el("defs", {}, svg);

// Grid pattern background
const pat = el("pattern", {id:"grid",width:"60",height:"60",patternUnits:"userSpaceOnUse"}, defs);
el("path",{d:"M60,0 L0,0 L0,60",fill:"none",stroke:"rgba(255,255,255,0.025)",
  "stroke-width":"0.5"}, pat);

el("rect",{width:W,height:H,fill:"url(#grid)"}, svg);

// Glow filter
const gf = el("filter",{id:"glow",x:"-50%",y:"-50%",width:"200%",height:"200%"}, defs);
el("feGaussianBlur",{in:"SourceGraphic",stdDeviation:"4",result:"blur"}, gf);
const fm = el("feMerge",{}, gf);
el("feMergeNode",{in:"blur"}, fm);
el("feMergeNode",{in:"SourceGraphic"}, fm);

// Soft glow for center
const cgf = el("filter",{id:"cglow",x:"-100%",y:"-100%",width:"300%",height:"300%"}, defs);
el("feGaussianBlur",{in:"SourceGraphic",stdDeviation:"18",result:"blur"}, cgf);
const cfm = el("feMerge",{}, cgf);
el("feMergeNode",{in:"blur"}, cfm);
el("feMergeNode",{in:"SourceGraphic"}, cfm);

// Center gradient
const radGrad = el("radialGradient",{id:"cg",cx:"50%",cy:"50%",r:"50%"}, defs);
el("stop",{offset:"0%","stop-color":"#818cf8"}, radGrad);
el("stop",{offset:"100%","stop-color":"#4f46e5"}, radGrad);

// Layers
const layerLines   = el("g",{id:"layer-lines"},   svg);
const layerLeafL   = el("g",{id:"layer-leaf-l"},  svg);
const layerBranch  = el("g",{id:"layer-branch"},  svg);
const layerCenter  = el("g",{id:"layer-center"},  svg);

const N = FEATURES.length;
const BRANCH_W = 160, BRANCH_H = 46;
const LEAF_W = 196, LEAF_H = 32;
const CENTER_R = 80;

// ─ draw features ─────────────────────────────
FEATURES.forEach((feat, i) => {
  const angleDeg = (i / N) * 360 - 90;
  const angleRad = (angleDeg * Math.PI) / 180;
  const bx = CX + R1 * Math.cos(angleRad);
  const by = CY + R1 * Math.sin(angleRad);

  // ─── connection line: center → branch ────
  el("path", {
    d: bezier(CX, CY, bx, by),
    fill: "none",
    stroke: feat.color,
    "stroke-width": "2",
    opacity: "0.45"
  }, layerLines);

  // ─── leaf cluster ─────────────────────────
  const leafCount = feat.items.length;
  const lClusterX = CX + R2 * Math.cos(angleRad);
  const lClusterY = CY + R2 * Math.sin(angleRad);

  // Spread leaves perpendicular to radial direction
  const perpX = -Math.sin(angleRad);
  const perpY =  Math.cos(angleRad);
  const step = leafCount > 1 ? (LEAF_SPREAD * 2) / (leafCount - 1) : 0;

  // branch → leaf cluster line
  el("path", {
    d: bezier(bx, by, lClusterX, lClusterY),
    fill: "none",
    stroke: feat.color,
    "stroke-width": "1.5",
    opacity: "0.3"
  }, layerLines);

  feat.items.forEach((item, j) => {
    const offset = leafCount > 1 ? (j - (leafCount - 1) / 2) * step : 0;
    const lx = lClusterX + perpX * offset;
    const ly = lClusterY + perpY * offset;

    // leaf connector
    el("path", {
      d: bezier(lClusterX, lClusterY, lx, ly),
      fill: "none",
      stroke: feat.color,
      "stroke-width": "1",
      opacity: "0.2"
    }, layerLines);

    // leaf node background
    const lg = el("g", {
      class: "leaf-node",
      transform: `translate(${lx - LEAF_W/2},${ly - LEAF_H/2})`
    }, layerLeafL);

    el("rect", {
      width: LEAF_W, height: LEAF_H, rx: "8", ry: "8",
      fill: hex2rgba(feat.color, 0.08),
      stroke: hex2rgba(feat.color, 0.25),
      "stroke-width": "1"
    }, lg);

    // NEW badge on new-feature leaf
    const isNewItem = item.endsWith("✦");
    const cleanItem = item.replace(" ✦","");

    // Text - handle long strings
    const displayText = cleanItem.length > 26 ? cleanItem.slice(0,24)+"…" : cleanItem;
    text(displayText, {
      x: LEAF_W/2, y: LEAF_H/2,
      "text-anchor": "middle",
      "dominant-baseline": "middle",
      fill: isNewItem ? "#fca5a5" : "#94a3b8",
      "font-size": "11",
      "font-weight": isNewItem ? "600" : "400"
    }, lg);

    if (isNewItem) {
      el("rect",{x: LEAF_W - 30, y: 4, width: 24, height: 14, rx: "4",
        fill:"rgba(239,68,68,0.2)", stroke:"rgba(239,68,68,0.4)", "stroke-width":"0.8"}, lg);
      text("NEW",{x: LEAF_W - 18, y: 11,
        "text-anchor":"middle","dominant-baseline":"middle",
        fill:"#f87171","font-size":"8","font-weight":"600"}, lg);
    }
  });

  // ─── branch node ──────────────────────────
  const bg = el("g", {
    class: "branch-node",
    "data-idx": i,
    transform: `translate(${bx - BRANCH_W/2},${by - BRANCH_H/2})`,
    style: "cursor:pointer"
  }, layerBranch);

  // drop shadow glow
  el("rect", {
    width: BRANCH_W, height: BRANCH_H, rx: "14", ry: "14",
    fill: hex2rgba(feat.color, 0.35),
    "filter": "url(#glow)"
  }, bg);

  el("rect", {
    width: BRANCH_W, height: BRANCH_H, rx: "14", ry: "14",
    fill: hex2rgba(feat.color, 0.18),
    stroke: feat.color,
    "stroke-width": "1.5"
  }, bg);

  if (feat.isNew) {
    el("rect", {
      x: BRANCH_W - 32, y: 4,
      width: 28, height: 15, rx: "5",
      fill: "rgba(239,68,68,0.25)",
      stroke: "rgba(239,68,68,0.6)", "stroke-width":"1"
    }, bg);
    text("NEW", {
      x: BRANCH_W - 18, y: 12,
      "text-anchor":"middle","dominant-baseline":"middle",
      fill:"#f87171","font-size":"9","font-weight":"700"
    }, bg);
  }

  // emoji + label
  const maxLabelLen = feat.isNew ? 15 : 18;
  const shortName = feat.name.replace(" ✦","");
  const label = shortName.length > maxLabelLen ? shortName.slice(0, maxLabelLen-1)+"…" : shortName;
  text(`${feat.emoji} ${label}`, {
    x: BRANCH_W/2 - (feat.isNew ? 12 : 0), y: BRANCH_H/2,
    "text-anchor": "middle",
    "dominant-baseline": "middle",
    fill: "#f1f5f9",
    "font-size": "13",
    "font-weight": "600"
  }, bg);
});

// ─── CENTER NODE ──────────────────────────────
const cg = el("g",{transform:`translate(${CX},${CY})`}, layerCenter);

// outer pulse ring
el("circle",{r:"100",fill:"none",stroke:"rgba(99,102,241,0.1)","stroke-width":"20"}, cg);
el("circle",{r:"85",fill:"none",stroke:"rgba(99,102,241,0.15)","stroke-width":"10"}, cg);

// center circle
el("circle",{r:CENTER_R, fill:"url(#cg)", filter:"url(#cglow)"}, cg);
el("circle",{r:CENTER_R, fill:"none", stroke:"rgba(165,180,252,0.4)", "stroke-width":"2"}, cg);

text("🌱",{x:0,y:-18,"text-anchor":"middle","dominant-baseline":"middle","font-size":"30"}, cg);
text("Life Planner",{x:0,y:12,
  "text-anchor":"middle","dominant-baseline":"middle",
  fill:"#f1f5f9","font-size":"16","font-weight":"800"}, cg);
text("v2.4",{x:0,y:30,
  "text-anchor":"middle","dominant-baseline":"middle",
  fill:"rgba(165,180,252,0.6)","font-size":"11","font-weight":"400"}, cg);

// ─────────────────────────────────────────────
// PAN + ZOOM
// ─────────────────────────────────────────────
const vp = svg;
let vx = 0, vy = 0, vscale = 1;
let dragging = false, lastX = 0, lastY = 0;

function applyTransform() {
  // Build viewBox from pan/zoom state
  const vw = W / vscale;
  const vh = H / vscale;
  const ox = vx - vw/2;
  const oy = vy - vh/2;
  svg.setAttribute("viewBox", `${ox} ${oy} ${vw} ${vh}`);
}

function resetView() {
  vx = CX; vy = CY; vscale = 0.24;
  applyTransform();
}

function zoom(factor) {
  vscale = Math.max(0.1, Math.min(4, vscale * factor));
  applyTransform();
}

resetView();

// Mouse drag
const wrap = document.getElementById("canvas-wrap");
wrap.addEventListener("mousedown", e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("mouseup", () => dragging = false);
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  const vw = W / vscale, vh = H / vscale;
  vx -= dx * (vw / window.innerWidth);
  vy -= dy * (vh / window.innerHeight);
  applyTransform();
});

// Scroll zoom
wrap.addEventListener("wheel", e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  // zoom toward mouse position
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const vw = W / vscale, vh = H / vscale;
  const ox = vx - vw/2, oy = vy - vh/2;
  const worldX = ox + mx / rect.width  * vw;
  const worldY = oy + my / rect.height * vh;
  vscale = Math.max(0.1, Math.min(4, vscale * factor));
  const vw2 = W / vscale, vh2 = H / vscale;
  vx = worldX + (vx - worldX) * (vw2/vw);
  vy = worldY + (vy - worldY) * (vh2/vh);
  applyTransform();
}, { passive: false });

// Touch support
let touches = [];
wrap.addEventListener("touchstart", e => {
  touches = Array.from(e.touches);
});
wrap.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = Array.from(e.touches);
  if (t.length === 1 && touches.length === 1) {
    const dx = t[0].clientX - touches[0].clientX;
    const dy = t[0].clientY - touches[0].clientY;
    const vw = W / vscale, vh = H / vscale;
    vx -= dx * (vw / window.innerWidth);
    vy -= dy * (vh / window.innerHeight);
    applyTransform();
  } else if (t.length === 2 && touches.length === 2) {
    const prev = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    const curr = Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    zoom(curr / prev);
  }
  touches = t;
}, { passive: false });

// ─────────────────────────────────────────────
// TOOLTIP on branch nodes
// ─────────────────────────────────────────────
const tooltip = document.getElementById("tooltip");
const ttTitle = document.getElementById("tt-title");
const ttList  = document.getElementById("tt-list");

document.querySelectorAll(".branch-node").forEach(node => {
  const idx = parseInt(node.getAttribute("data-idx"));
  const feat = FEATURES[idx];
  node.addEventListener("mouseenter", e => {
    ttTitle.textContent = `${feat.emoji} ${feat.name.replace(" ✦","")}`;
    ttTitle.style.color = feat.color;
    ttList.innerHTML = feat.items.slice(0,6)
      .map(i => `<li>${i.replace(" ✦","")}</li>`).join("");
    if (feat.items.length > 6) {
      ttList.innerHTML += `<li style="color:#475569">+${feat.items.length-6} more…</li>`;
    }
    tooltip.classList.add("show");
    positionTooltip(e);
  });
  node.addEventListener("mousemove", positionTooltip);
  node.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
});

function positionTooltip(e) {
  const x = Math.min(e.clientX + 16, window.innerWidth - 240);
  const y = Math.min(e.clientY - 10, window.innerHeight - 200);
  tooltip.style.left = x + "px";
  tooltip.style.top  = y + "px";
}

// ─────────────────────────────────────────────
// BUTTONS
// ─────────────────────────────────────────────
document.getElementById("btn-zoom-in").addEventListener("click",  () => zoom(1.25));
document.getElementById("btn-zoom-out").addEventListener("click", () => zoom(0.8));
document.getElementById("btn-reset").addEventListener("click",    resetView);
</script>
</body>
