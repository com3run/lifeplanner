$kind: http-example
description: Fetch a single public persona by mascotId. By default includes the public media library with engagement stats.
request:
  url: https://jimiwruckhlxkmnduhrn.supabase.co/functions/v1/persona-api?includeMedia=true&mediaLimit=24&sort=recent
  method: GET
  headers:
    x-api-key: "{{PERSONA_API_SECRET}}"
  queryParams:
    - key: mascotId
      value: <uuid>
      disabled: true
      description: Fetch a single public persona by id
    - key: includeMedia
      value: "true"
      description: '"true" (default) | "false" — include public media library with engagement stats'
    - key: mediaLimit
      value: "24"
      description: 1–100 (default 24) — number of media items to return
    - key: sort
      value: recent
      description: '"recent" (default) | "engagement" | "likes" | "views"'
